[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfdet"
version = "0.2.0"
description = "Energy-Efficient Wolf Detection and Automated Human-Speech Deterrence System for Raspberry Pi 4B + Camera Module 3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Umut Ege Özdemir" }
]
keywords = ["wolf-detection", "edge-ai", "raspberry-pi", "ubiquitous-computing", "wildlife-deterrence", "abr"]
dependencies = []

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "ultralytics>=8.3.0",
    "pytest>=8.0.0",
]
pi = [
    "PyYAML>=6.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "gpiozero>=2.0.1",
    "RPi.GPIO>=0.7.1",
]

[project.scripts]
wolfdet = "wolfdet.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
