# 5-Class Wildlife Camera-Trap Dataset Schema for WolfDet
# Designed to minimize Wolf vs. Domestic Dog / Fox false positives and enforce GDPR Person filtering.
#
# Expected folder layout (Ultralytics YOLO format):
#   datasets/wolfdet/
#     ├── images/{train,val,test}/
#     └── labels/{train,val,test}/

path: ../datasets/wolfdet
train: images/train
val: images/val
test: images/test

names:
  0: wolf      # Primary target class (Canis lupus) -> triggers human-speech deterrent
  1: dog       # Hard negative #1 (domestic / herding dogs) -> DO NOT trigger
  2: fox       # Hard negative #2 (red fox, Vulpes vulpes) -> DO NOT trigger
  3: deer      # Common forest wildlife (roe/red deer) -> DO NOT trigger
  4: person    # GDPR Privacy Guard -> immediately wipe buffer & suppress playback
