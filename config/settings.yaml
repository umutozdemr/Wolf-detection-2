# Master Configuration for Energy-Efficient Wolf Detection & Response System
# Target Hardware: Raspberry Pi 4 Model B (4 GB) + Raspberry Pi Camera Module 3 (IMX708)
# Scientific Protocol: Suraci et al. (2017) ABR + Zanette et al. (2023) Human "Super Predator"

system:
  device_id: "siegen-wolfdet-01"
  mode: "demo"                 # "demo" | "pc_video" | "raspberry_pi"
  log_dir: "logs"
  recording_dir: "recordings"

camera:
  backend: "synthetic"         # "synthetic" | "opencv" | "picamera2"
  source: "0"                  # Video path or camera index (when backend == "opencv")
  width: 640
  height: 480
  detect_fps: 4.0              # Low FPS during AI detection window to save Pi 4 CPU power
  idle_poll_interval_s: 0.25   # Polling interval in IDLE state
  autofocus: true              # Camera Module 3 continuous/auto focus
  hdr: true                    # Camera Module 3 HDR for forest shadow/sunlight contrast

motion:
  backend: "software"          # "software" | "pir_gpio" | "mock"
  pir_gpio_pin: 17             # BCM GPIO 17 (Physical Pin 11) -> HC-SR501 OUT (3.3V)
  detect_window_s: 15.0        # How long to keep AI active after a motion trigger
  software_diff_threshold: 25  # Pixel delta threshold for software motion gating
  software_min_area_ratio: 0.01

detection:
  backend: "mock"              # "mock" | "yolo"
  model_path: "models/wolfdet_yolov8n.onnx"
  target_classes: ["wolf"]
  privacy_classes: ["person"]  # GDPR guard: immediately drop frame & suppress recording/audio
  conf_threshold: 0.60
  iou_threshold: 0.45
  # Temporal Confirmation (M-of-N voting) to prevent single-frame false alarms (e.g. dogs/foxes/blur)
  confirm_hits: 3
  confirm_window: 5
  # Optional demo convenience: treat COCO "dog" as wolf proxy ONLY when testing stock COCO weights
  demo_dog_as_wolf_proxy: false

response:
  pre_playback_delay_s: 2.0    # 0-3s delay (Zanette 2023 used 3s) to capture pre-playback behavior
  playback_duration_s: 10.0    # 10s calm human conversation clip (Suraci 2017 & Zanette 2023)
  cooldown_s: 30.0             # Cooldown period after playback before re-triggering
  audio_dir: "assets/audio"
  randomize_no_repeat: true    # Prevent immediate repetition across 8-14 exemplars (anti-habituation)
  amp_shutdown_gpio_pin: 27    # BCM GPIO 27 (Physical Pin 13) -> MAX98357A SD pin (HIGH=ON, LOW=0mA)
  enable_sound_output: true

recorder:
  enabled: true
  pre_trigger_buffer_s: 3.0    # Circular buffer retained before playback
  post_trigger_record_s: 10.0  # Post-playback observation window to verify flight response
  save_video_clips: true

power_model:
  # Estimated Raspberry Pi 4B (4 GB) + Cam Mod 3 + MAX98357A power draw per state (Watts)
  idle_w: 2.10                 # Pi 4 optimized idle (HDMI/BT/Wi-Fi off, PIR active)
  detecting_w: 4.80            # Camera Module 3 + YOLOv8n NCNN/ONNX inference at 4 FPS
  responding_w: 6.20           # Camera + MAX98357A 3W playback + SD card write
  cooldown_w: 2.40             # Camera standby, amp OFF (SD=LOW)
  battery_capacity_wh: 74.0    # e.g. 20,000 mAh @ 3.7V powerbank (~74 Wh, ~63 Wh usable @ 85% eff.)
  usable_efficiency: 0.85
